services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-dashboard
    restart: unless-stopped
    command: node dashboard/server.js
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
    networks:
      - market-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-scheduler
    restart: unless-stopped
    command: python scheduler.py
    ports:
      - "5001:5001"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
    depends_on:
      - dashboard
    networks:
      - market-network

networks:
  market-network:
    driver: bridge
