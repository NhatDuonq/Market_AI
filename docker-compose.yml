services:
  mongo:
    image: mongo:7.0
    container_name: market-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - market-network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-dashboard
    restart: unless-stopped
    command: node dashboard/server.js
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
    depends_on:
      - mongo
    networks:
      - market-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-scheduler
    restart: unless-stopped
    command: python scheduler.py
    ports:
      - "5001:5001"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
    depends_on:
      - dashboard
      - mongo
    networks:
      - market-network

volumes:
  mongo_data:

networks:
  market-network:
    driver: bridge

